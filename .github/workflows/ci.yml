name: CI - Build & Lint

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Check Kotlin formatting (spotless if present)
        run: ./gradlew tasks --all | grep -i spotless || echo "no spotless task"
      - name: Assemble Debug to verify compilation
        run: ./gradlew :app:assembleDebug :core:model:build --stacktrace
